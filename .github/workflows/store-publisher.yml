name: Microsoft Store publisher

on:
  workflow_run:
    workflows:
      - Main release build
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      package_version:
        description: Store package version (four parts; final component must be 0)
        required: true
        default: 1.0.2.0
        type: string
      verify_connection:
        description: Authenticate and verify access to the SafeSpeak Partner Center product
        required: true
        default: true
        type: boolean
      upload_draft:
        description: Upload the verified bundle to a Partner Center draft
        required: true
        default: false
        type: boolean
      commit_submission:
        description: Commit the uploaded draft for Microsoft certification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: safespeak-microsoft-store
  cancel-in-progress: false

jobs:
  build-store-bundle:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      store_package_version: ${{ steps.store-version.outputs.version }}
    env:
      STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
      STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
      STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.STORE_PUBLISHER_DISPLAY_NAME }}
      UPLOAD_DRAFT: ${{ github.event_name == 'workflow_run' || inputs.upload_draft }}
      COMMIT_SUBMISSION: ${{ github.event_name == 'workflow_run' || inputs.commit_submission }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache pinned Kokoro smoke-test model
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\safespeak-kokoro\kokoro.onnx
          key: kokoro-v2-${{ runner.os }}-0CFD5E79AAB70A3D8C1A57DC639835110DDB32C9F5FF4FDD1F4DB202EA43BB05

      - name: Prepare pinned Kokoro smoke-test model
        shell: pwsh
        env:
          KOKORO_MODEL_PATH: ${{ runner.temp }}\safespeak-kokoro\kokoro.onnx
          KOKORO_MODEL_URL: https://github.com/Lyrcaxis/KokoroSharpBinaries/releases/download/v2.0.0/kokoro.onnx
          KOKORO_MODEL_SHA256: 0CFD5E79AAB70A3D8C1A57DC639835110DDB32C9F5FF4FDD1F4DB202EA43BB05
        run: |
          $modelDirectory = Split-Path -Parent $env:KOKORO_MODEL_PATH
          New-Item -ItemType Directory -Path $modelDirectory -Force | Out-Null
          $downloadPath = "$($env:KOKORO_MODEL_PATH).download"
          if (-not (Test-Path -LiteralPath $env:KOKORO_MODEL_PATH) -or
              (Get-FileHash -LiteralPath $env:KOKORO_MODEL_PATH -Algorithm SHA256).Hash -ne $env:KOKORO_MODEL_SHA256) {
            Remove-Item -LiteralPath $env:KOKORO_MODEL_PATH -Force -ErrorAction SilentlyContinue
            Invoke-WebRequest -Uri $env:KOKORO_MODEL_URL -OutFile $downloadPath
            $actualHash = (Get-FileHash -LiteralPath $downloadPath -Algorithm SHA256).Hash
            if ($actualHash -ne $env:KOKORO_MODEL_SHA256) {
              Remove-Item -LiteralPath $downloadPath -Force -ErrorAction SilentlyContinue
              throw "The Kokoro smoke-test model failed integrity verification: $actualHash"
            }
            Move-Item -LiteralPath $downloadPath -Destination $env:KOKORO_MODEL_PATH -Force
          }
          "SAFESPEAK_KOKORO_MODEL_PATH=$($env:KOKORO_MODEL_PATH)" >> $env:GITHUB_ENV

      - name: Resolve Store package version
        id: store-version
        shell: pwsh
        env:
          REQUESTED_PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          $version = $env:REQUESTED_PACKAGE_VERSION
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$props = Get-Content -LiteralPath 'Directory.Build.props' -Raw
            $version = [string](
              $props.Project.PropertyGroup.SafeSpeakStoreVersion |
                Select-Object -First 1)
          }
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'The Store package version must contain four numeric components.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate Store workflow inputs
        shell: pwsh
        run: |
          $required = @(
            'STORE_IDENTITY_NAME',
            'STORE_PUBLISHER',
            'STORE_PUBLISHER_DISPLAY_NAME'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing required GitHub variables: $($missing -join ', ')"
          }
          if ($env:COMMIT_SUBMISSION -eq 'true' -and $env:UPLOAD_DRAFT -ne 'true') {
            throw 'commit_submission requires upload_draft.'
          }

      - name: Build and verify Store bundle
        shell: pwsh
        run: |
          ./installer/Build-StoreBundle.ps1 `
            -PackageVersion '${{ steps.store-version.outputs.version }}' `
            -IdentityName $env:STORE_IDENTITY_NAME `
            -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME

      - name: Upload verified Store candidate
        uses: actions/upload-artifact@v7
        with:
          name: SafeSpeak-store-${{ steps.store-version.outputs.version }}
          path: |
            artifacts/store/*.msix
            artifacts/store/*.msixbundle
            artifacts/store/*.release.json
            artifacts/store/*.store-bundle.json
          if-no-files-found: error
          retention-days: 30

  partner-center:
    if: ${{ github.event_name == 'workflow_run' || inputs.verify_connection || inputs.upload_draft }}
    needs: build-store-bundle
    runs-on: windows-latest
    timeout-minutes: 30
    environment:
      name: microsoft-store-production
    env:
      STORE_APP_ID: ${{ vars.STORE_APP_ID }}
      PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
      PARTNER_CENTER_SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
      PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
      PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      COMMIT_SUBMISSION: ${{ github.event_name == 'workflow_run' || inputs.commit_submission }}

    steps:
      - name: Download verified Store candidate
        if: ${{ github.event_name == 'workflow_run' || inputs.upload_draft }}
        uses: actions/download-artifact@v7
        with:
          name: SafeSpeak-store-${{ needs.build-store-bundle.outputs.store_package_version }}
          path: artifacts/store

      - name: Install Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4
        with:
          version: v0.3.9

      - name: Validate protected Partner Center configuration
        shell: pwsh
        run: |
          $required = @(
            'STORE_APP_ID',
            'PARTNER_CENTER_TENANT_ID',
            'PARTNER_CENTER_SELLER_ID',
            'PARTNER_CENTER_CLIENT_ID',
            'PARTNER_CENTER_CLIENT_SECRET'
          )
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            throw "Missing protected Store configuration: $($missing -join ', ')"
          }

      - name: Authenticate Microsoft Store Developer CLI
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId $env:PARTNER_CENTER_TENANT_ID `
            --sellerId $env:PARTNER_CENTER_SELLER_ID `
            --clientId $env:PARTNER_CENTER_CLIENT_ID `
            --clientSecret $env:PARTNER_CENTER_CLIENT_SECRET

      - name: Verify SafeSpeak Partner Center access
        shell: pwsh
        run: msstore apps get $env:STORE_APP_ID

      - name: Upload Partner Center draft or commit approved submission
        if: ${{ github.event_name == 'workflow_run' || inputs.upload_draft }}
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath 'artifacts/store' `
            -Filter '*.msixbundle' -File)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one Store bundle and found $($bundles.Count)."
          }
          $bundle = $bundles[0]
          $arguments = @(
            'publish',
            $bundle.FullName,
            '--appId', $env:STORE_APP_ID
          )
          if ($env:COMMIT_SUBMISSION -ne 'true') {
            $arguments += '--noCommit'
          }
          & msstore @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Store Developer CLI failed with exit code $LASTEXITCODE."
          }
