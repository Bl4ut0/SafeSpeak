name: Android test build

on:
  pull_request:
    branches:
      - android/develop
      - android/main
  push:
    branches:
      - android/develop
      - android/main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safespeak-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Test portable core and build Android APK
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install mobile .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: mobile/global.json

      - name: Install supported Java development kit
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install Android workload
        shell: pwsh
        working-directory: mobile
        run: dotnet workload install maui-android

      - name: Install required Android SDK components
        shell: pwsh
        working-directory: mobile
        run: >-
          dotnet build ../src/SafeSpeak.Mobile/SafeSpeak.Mobile.csproj
          -t:InstallAndroidDependencies
          -f net10.0-android
          -p:SafeSpeakMobileTargetFrameworks=net10.0-android
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"
          -p:AcceptAndroidSdkLicenses=true

      - name: Test portable mobile foundation
        shell: pwsh
        working-directory: mobile
        run: dotnet test ../tests/SafeSpeak.Mobile.Foundation.Tests/SafeSpeak.Mobile.Foundation.Tests.csproj -c Release

      - name: Build installable Android test APK
        shell: pwsh
        working-directory: mobile
        run: >-
          dotnet build ../src/SafeSpeak.Mobile/SafeSpeak.Mobile.csproj
          -c Release
          -f net10.0-android
          -p:SafeSpeakMobileTargetFrameworks=net10.0-android
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=false
          -p:AndroidSdkDirectory="$env:ANDROID_HOME"
          -p:JavaSdkDirectory="$env:JAVA_HOME"

      - name: Upload Android test build
        uses: actions/upload-artifact@v7
        with:
          name: SafeSpeak-Android-test-${{ github.sha }}
          path: src/SafeSpeak.Mobile/bin/Release/net10.0-android/**/*.apk
          if-no-files-found: error
          retention-days: ${{ (github.ref_name == 'android/main' || github.base_ref == 'android/main') && 14 || 7 }}
