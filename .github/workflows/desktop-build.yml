name: Main release build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safespeak-main-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build, test, and package desktop application
        shell: pwsh
        run: ./installer/Build-Release.ps1 -Architecture ${{ matrix.architecture }} -Format Both

      - name: Validate and package Stream Deck plug-in
        if: matrix.architecture == 'x64'
        shell: pwsh
        run: |
          npm install -g @elgato/cli@1.9.0
          ./streamdeck/Build-Plugin.ps1

      - name: Upload verified desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SafeSpeak-windows-${{ matrix.architecture }}
          path: |
            artifacts/*.zip
            artifacts/*.msix
            artifacts/*.release.json
            artifacts/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
